name: Incremental Download Validation

# Validates "Download only changed files" for the SidePC download mechanism.
# Uses the same actions/checkout settings as MainlineTeamTests.yml / TestStarterDevelopment.yml
# (sparse-checkout .github, depth 1, clean), but checks out the test branch into a separate
# folder (<workspace>\incremental-test) so production checkouts are not touched.
# The folder is kept between runs, so scenarios 2-8 build on scenario 1.
#
# Test files: branch "incremental-download-test", folder .github/IncrementalTest
# Run scenarios 1..8 in order; make the scenario change on the test branch before each run.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: SidePC runner label
        required: true
        default: vtest-client-test
      scenario:
        description: Scenario (1 = empty destination first)
        required: true
        type: choice
        options: ['1', '2', '3', '4', '5', '6', '7', '8']
      test_ref:
        description: Branch containing the test files
        required: true
        default: incremental-download-test

concurrency:
  group: incremental-download-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  validate:
    name: Scenario ${{ inputs.scenario }} on ${{ inputs.runner }}
    runs-on: [self-hosted, Windows, X64, '${{ inputs.runner }}']
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    env:
      SCENARIO: ${{ inputs.scenario }}
      TEST_DIR: ${{ github.workspace }}\incremental-test

    steps:
      - name: Prepare evidence folder and helpers
        run: |
          $ev = Join-Path $env:RUNNER_TEMP 'evidence'
          if (Test-Path $ev) { Remove-Item $ev -Recurse -Force }
          New-Item -ItemType Directory $ev | Out-Null
          @'
          function Get-Snapshot([string]$root) {
            if (-not (Test-Path $root)) { return @() }
            $rootFull = (Resolve-Path $root).Path.TrimEnd('\') + '\'
            Get-ChildItem $root -Recurse -File -Force |
              Where-Object { -not $_.FullName.StartsWith($rootFull + '.git\', [StringComparison]::OrdinalIgnoreCase) } |
              ForEach-Object {
                [pscustomobject]@{
                  Path     = $_.FullName.Substring($rootFull.Length)
                  Size     = $_.Length
                  Created  = $_.CreationTimeUtc.Ticks
                  Modified = $_.LastWriteTimeUtc.Ticks
                  SHA256   = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                }
              }
          }
          function Get-ObjectStoreKiB([string]$repo) {
            $v = @{}
            git -C $repo count-objects -v | ForEach-Object { $k, $n = $_ -split ':\s*', 2; $v[$k] = [long]$n }
            return $v['size'] + $v['size-pack']
          }
          '@ | Set-Content (Join-Path $env:RUNNER_TEMP 'snapshot.ps1')

      - name: Check Git on runner PATH
        run: |
          $git = Get-Command git -ErrorAction SilentlyContinue
          if (-not $git) {
            Write-Host "::warning::Git is not on PATH. actions/checkout will use the REST API (full download every run)."
          } else {
            git --version
            $crlf = git config --global core.autocrlf
            if (-not $crlf) { $crlf = '(not set)' }
            Write-Host "core.autocrlf = $crlf"
          }
          exit 0

      - name: Scenario 1 - empty the destination
        if: inputs.scenario == '1'
        run: |
          if (Test-Path $env:TEST_DIR) { Remove-Item $env:TEST_DIR -Recurse -Force }
          Write-Host "Destination emptied: $env:TEST_DIR"

      - name: Snapshot before checkout
        run: |
          . (Join-Path $env:RUNNER_TEMP 'snapshot.ps1')
          $ev = Join-Path $env:RUNNER_TEMP 'evidence'
          $before = @(Get-Snapshot $env:TEST_DIR)
          $before | Export-Csv "$ev\before.csv" -NoTypeInformation
          if (Test-Path "$env:TEST_DIR\.git") {
            git -C $env:TEST_DIR rev-parse HEAD | Set-Content "$ev\before-head.txt"
            Get-ObjectStoreKiB $env:TEST_DIR | Set-Content "$ev\before-objects-kib.txt"
          } else {
            'none' | Set-Content "$ev\before-head.txt"
            '0' | Set-Content "$ev\before-objects-kib.txt"
          }
          Write-Host "Destination: $env:TEST_DIR"
          Write-Host "Files before checkout: $($before.Count)"
          exit 0

      - name: Checkout (mechanism under test)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_ref }}
          path: incremental-test
          sparse-checkout: .github
          fetch-depth: 1
          clean: true
          show-progress: true

      - name: Compare, verify and report
        run: |
          . (Join-Path $env:RUNNER_TEMP 'snapshot.ps1')
          $ev = Join-Path $env:RUNNER_TEMP 'evidence'
          $t  = '.github\IncrementalTest\'

          # 1. Before/after file comparison (what was written on disk)
          $after = @(Get-Snapshot $env:TEST_DIR)
          $after | Export-Csv "$ev\after.csv" -NoTypeInformation
          $before = @()
          if ((Test-Path "$ev\before.csv") -and (Get-Item "$ev\before.csv").Length -gt 0) { $before = @(Import-Csv "$ev\before.csv") }
          $b = @{}; foreach ($f in $before) { $b[$f.Path] = $f }
          $a = @{}; foreach ($f in $after)  { $a[$f.Path] = $f }
          $rows = foreach ($p in (@($b.Keys) + @($a.Keys) | Sort-Object -Unique)) {
            $x = $b[$p]; $y = $a[$p]
            if (-not $x)     { $s = 'Added' }
            elseif (-not $y) { $s = 'Removed' }
            elseif ($x.SHA256 -ne $y.SHA256) { $s = 'ContentChanged' }
            elseif ([string]$x.Modified -ne [string]$y.Modified -or [string]$x.Created -ne [string]$y.Created) { $s = 'RewrittenSameContent' }
            else { $s = 'Untouched' }
            [pscustomobject]@{
              Path = $p; Status = $s
              SizeBefore = $x.Size; SizeAfter = $y.Size
              SHA256Before = $x.SHA256; SHA256After = $y.SHA256
            }
          }
          $rows = @($rows)
          $rows | Export-Csv "$ev\changed-files.csv" -NoTypeInformation
          $changed = @($rows | Where-Object Status -ne 'Untouched')

          # 2. Source (commit) vs destination for the test folder
          Push-Location $env:TEST_DIR
          $head = (git rev-parse HEAD).Trim()
          $srcPaths = @()
          $srcCheck = @(foreach ($e in (git -c core.quotePath=false ls-tree -r HEAD -- .github/IncrementalTest)) {
            $meta, $path = $e -split "`t", 2
            $srcPaths += $path.Replace('/', '\')
            $blob = ($meta -split ' ')[2]
            $local = 'MISSING'
            if (Test-Path -LiteralPath $path) { $local = (git hash-object -- $path).Trim() }
            [pscustomobject]@{ Path = $path; SourceBlob = $blob; DestinationBlob = $local; Match = ($blob -eq $local) }
          })
          $srcCheck | Export-Csv "$ev\source-vs-destination.csv" -NoTypeInformation
          $obsolete = @()
          if (Test-Path '.github\IncrementalTest') {
            $obsolete = @(Get-ChildItem '.github\IncrementalTest' -Recurse -File -Force |
              ForEach-Object { $_.FullName.Substring($env:TEST_DIR.Length + 1) } |
              Where-Object { $srcPaths -notcontains $_ })
          }
          $status = @(git status --porcelain --untracked-files=all --ignored)
          $status | Set-Content "$ev\git-status.txt"
          Pop-Location

          # 3. Data transferred into the local Git object store
          $kibBefore = [long](Get-Content "$ev\before-objects-kib.txt")
          $kibAfter  = Get-ObjectStoreKiB $env:TEST_DIR
          $kibDelta  = $kibAfter - $kibBefore

          # 4. Expected result per scenario
          $expected = @{
            '2' = @()
            '3' = @("${t}FileA.ps1")
            '4' = @("${t}FileB.ps1", "${t}FileC.ps1", "${t}FileD.ps1")
            '5' = @("${t}NewFile.ps1")
            '6' = @("${t}FileE.ps1")
            '7' = @("${t}FileA.ps1", "${t}Moved\FileA_New.ps1")
            '8' = @("${t}FileB.ps1")
          }
          $srcOk = (@($srcCheck | Where-Object { -not $_.Match }).Count -eq 0) -and ($obsolete.Count -eq 0) -and ($status.Count -eq 0)
          if ($env:SCENARIO -eq '1') {
            $selOk = ($before.Count -eq 0) -and (@($rows | Where-Object Status -ne 'Added').Count -eq 0) -and ($after.Count -gt 0)
            $expectedText = 'All files added to an empty destination'
          } else {
            $exp = @($expected[$env:SCENARIO] | Sort-Object)
            $got = @($changed.Path | Sort-Object)
            $selOk = (($exp -join '|') -eq ($got -join '|'))
            $expectedText = if ($exp.Count) { $exp -join ', ' } else { 'No files changed' }
          }
          $verdict = if ($selOk -and $srcOk) { 'PASS' } else { 'FAIL' }

          # 5. Report
          $count = { param($s) @($rows | Where-Object Status -eq $s).Count }
          $md = @()
          $md += "## Scenario $env:SCENARIO - $verdict"
          $md += ""
          $md += "Runner: $env:RUNNER_NAME ($env:COMPUTERNAME)  Commit: $head  Previous: $(Get-Content "$ev\before-head.txt")"
          $md += ""
          $md += "| Files before | Files after | Added | Removed | Content changed | Rewritten, same content | Untouched | Git objects received (KiB) |"
          $md += "|---|---|---|---|---|---|---|---|"
          $md += "| $($before.Count) | $($after.Count) | $(& $count 'Added') | $(& $count 'Removed') | $(& $count 'ContentChanged') | $(& $count 'RewrittenSameContent') | $(& $count 'Untouched') | $kibDelta |"
          $md += ""
          $md += "Expected changes: $expectedText"
          $md += ""
          $fmtTime = { param($ticks) if ($ticks) { ([datetime]::new([long]$ticks, 'Utc')).ToString('yyyy-MM-dd HH:mm:ss') + ' UTC' } }
          $md += "### SidePC BEFORE run ($t)"
          $md += "| File | Size (bytes) | Last written | SHA-256 (first 12) |"
          $md += "|---|---|---|---|"
          $bt = @($before | Where-Object { $_.Path.StartsWith($t) } | Sort-Object Path)
          if (-not $bt.Count) { $md += "| (empty - no files on SidePC) | | | |" }
          foreach ($f in $bt) { $md += "| $($f.Path.Substring($t.Length)) | $($f.Size) | $(& $fmtTime $f.Modified) | $($f.SHA256.Substring(0,12)) |" }
          $md += ""
          $md += "### SidePC AFTER run ($t)"
          $md += "| File | Size (bytes) | Last written | SHA-256 (first 12) | Change made by this run |"
          $md += "|---|---|---|---|---|"
          foreach ($r in ($rows | Where-Object { $_.Path.StartsWith($t) } | Sort-Object Path)) {
            $y = $a[$r.Path]
            if ($y) { $md += "| $($r.Path.Substring($t.Length)) | $($y.Size) | $(& $fmtTime $y.Modified) | $($y.SHA256.Substring(0,12)) | $($r.Status) |" }
            else    { $md += "| ~~$($r.Path.Substring($t.Length))~~ | - | - | - | Removed |" }
          }
          $md += ""
          if ($env:SCENARIO -ne '1' -or $changed.Count -le 50) {
            $md += "| Changed file | Status | Size before | Size after |"
            $md += "|---|---|---|---|"
            foreach ($r in $changed) { $md += "| $($r.Path) | $($r.Status) | $($r.SizeBefore) | $($r.SizeAfter) |" }
            $md += ""
          }
          $md += "Source vs destination (test folder): $(@($srcCheck | Where-Object Match).Count)/$($srcCheck.Count) Git blob hashes match"
          $md += "Obsolete files left in the test folder: $($obsolete.Count) $($obsolete -join ', ')"
          $md += "git status (modified/untracked/ignored): $($status.Count) entries"
          $md | Set-Content "$ev\summary.md"
          $md | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding ascii
          $md | ForEach-Object { Write-Host $_ }
          if ($verdict -ne 'PASS') { exit 1 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-evidence-scenario-${{ inputs.scenario }}-run-${{ github.run_number }}
          path: ${{ runner.temp }}\evidence
