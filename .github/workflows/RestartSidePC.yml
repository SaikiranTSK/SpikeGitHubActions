name: RestartSidePC
run-name: ${{ inputs.SystemName }}_${{ inputs.Batch }}

on:
  workflow_dispatch:
    inputs:
      SystemName:
        description: Side PC (runner name / label)
        required: true
        type: string
      Batch:
        description: Batch folder name
        required: true
        type: string
        default: RestartSidePC
      RunAt:
        description: "Optional UTC time (yyyy-MM-ddTHH:mm:ssZ), e.g. 2026-10-17T18:30:00Z; blank or past runs immediately. Max wait is about 5.5 hours."
        required: false
        type: string

permissions:
  contents: read

env:
  BATCHES_SHARE: ${{ vars.BATCHES_SHARE || '\\nlybstqvp4dt7nv\JenkinsBatches' }}

jobs:
  wait-until:
    if: ${{ inputs.RunAt != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 360
    steps:
      - name: Wait until RunAt (UTC)
        shell: bash
        env:
          RUN_AT: ${{ inputs.RunAt }}
        run: |
          if [[ ! "$RUN_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] ||
             ! target=$(date -u -d "$RUN_AT" +%s 2>/dev/null); then
            echo "::error::Invalid RunAt. Use UTC format yyyy-MM-ddTHH:mm:ssZ (example: 2026-10-17T18:30:00Z)."
            exit 1
          fi

          delay=$((target - $(date -u +%s)))
          if (( delay > 19800 )); then
            echo "::error::RunAt must be no more than 5.5 hours in the future."
            exit 1
          fi

          if (( delay > 0 )); then
            echo "Waiting $delay seconds until $RUN_AT (UTC)."
            sleep "$delay"
          else
            echo "RunAt is in the past; continuing immediately."
          fi

  check-runner:
    needs: wait-until
    if: ${{ !failure() && !cancelled() && (needs.wait-until.result == 'success' || needs.wait-until.result == 'skipped') }}
    uses: ./.github/workflows/check-runner.yml
    with:
      system-name: ${{ inputs.SystemName }}
    secrets: inherit

  restart-side-pc:
    name: RestartSidePC on ${{ inputs.SystemName }}
    needs: check-runner
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, Windows, '${{ inputs.SystemName }}']
    timeout-minutes: 1440
    defaults:
      run:
        shell: powershell
    env:
      SYSTEM_NAME: ${{ inputs.SystemName }}
      BATCH: ${{ inputs.Batch }}
    steps:
      - name: Get pipeline scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: CopyRundataFromShare
        run: |
          if ($env:BATCH -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]*$') {
            throw "Invalid batch folder name: $env:BATCH"
          }
          if ([string]::IsNullOrWhiteSpace($env:BATCHES_SHARE) -or
              -not (Test-Path -LiteralPath $env:BATCHES_SHARE -PathType Container)) {
            throw 'BATCHES_SHARE must be a nonempty, accessible directory.'
          }
          $serverDirectory = Join-Path $env:BATCHES_SHARE "Batches\$env:BATCH"
          if (-not (Test-Path -LiteralPath $serverDirectory -PathType Container)) {
            throw "Batch folder not found: $serverDirectory"
          }
          $runPath = Join-Path $env:GITHUB_WORKSPACE $env:BATCH

          & robocopy.exe (Join-Path $env:GITHUB_WORKSPACE '.github/Tools') (Join-Path $env:GITHUB_WORKSPACE 'Tools') /E /ZB /MIR /R:3 /W:5 | Out-Host
          $toolsCode = $LASTEXITCODE
          if ($toolsCode -ge 8) {
            throw "Copying Tools failed with robocopy exit code $toolsCode."
          }

          & robocopy.exe $serverDirectory $runPath /E /ZB /MIR /R:3 /W:5 | Out-Host
          $batchCode = $LASTEXITCODE
          if ($batchCode -ge 8) {
            throw "Copying $env:BATCH failed with robocopy exit code $batchCode."
          }
          $global:LASTEXITCODE = 0

      - name: CheckRunningOnNode
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          CheckRunningOnNode

      - name: WarnUser
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          KillTasks

      - name: RestartSidePC
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          $runPath = Join-Path $env:GITHUB_WORKSPACE $env:BATCH
          StartTestsFromBatch $runPath $env:SYSTEM_NAME $env:BATCH
