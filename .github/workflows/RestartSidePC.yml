name: RestartSidePC
run-name: ${{ inputs.SystemName }}_${{ inputs.Batch }}

on:
  workflow_dispatch:
    inputs:
      SystemName:
        description: Side PC (runner name / label)
        required: true
        type: string
      Batch:
        description: Batch folder name
        required: true
        type: string
        default: RestartSidePC
      RunAt:
        description: "Optional UTC time (yyyy-MM-ddTHH:mm:ssZ); blank or past runs immediately. Waiting counts toward the 24-hour job timeout."
        required: false
        type: string

permissions:
  contents: read

env:
  BATCHES_SHARE: ${{ vars.BATCHES_SHARE || '\\nlybstqvp4dt7nv\JenkinsBatches' }}

jobs:
  check-runner:
    uses: ./.github/workflows/check-runner.yml
    with:
      system-name: ${{ inputs.SystemName }}
    secrets: inherit

  restart-side-pc:
    name: RestartSidePC on ${{ inputs.SystemName }}
    needs: check-runner
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, Windows, '${{ inputs.SystemName }}']
    timeout-minutes: 1440
    defaults:
      run:
        shell: powershell
    env:
      SYSTEM_NAME: ${{ inputs.SystemName }}
      BATCH: ${{ inputs.Batch }}
    steps:
      - name: Wait until RunAt (UTC)
        env:
          RUN_AT: ${{ inputs.RunAt }}
        run: |
          if ([string]::IsNullOrEmpty($env:RUN_AT)) {
            Write-Host "RunAt not provided; continuing immediately."
            return
          }

          $target = [datetimeoffset]::MinValue
          $styles = [System.Globalization.DateTimeStyles]::AssumeUniversal -bor [System.Globalization.DateTimeStyles]::AdjustToUniversal
          if (-not [datetimeoffset]::TryParseExact(
            $env:RUN_AT,
            "yyyy-MM-dd'T'HH:mm:ss'Z'",
            [System.Globalization.CultureInfo]::InvariantCulture,
            $styles,
            [ref]$target
          )) {
            throw "Invalid RunAt. Use UTC format yyyy-MM-ddTHH:mm:ssZ (example: 2026-10-17T18:30:00Z)."
          }

          Write-Host "Waiting until $($target.ToString('u')) (UTC), if still in the future."
          while (($remaining = ($target - [datetimeoffset]::UtcNow).TotalSeconds) -gt 0) {
            Start-Sleep -Seconds ([int][math]::Min(60.0, [math]::Ceiling($remaining)))
          }

      - name: Get pipeline scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: CopyRundataFromShare
        run: |
          if ($env:BATCH -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]*$') {
            throw "Invalid batch folder name: $env:BATCH"
          }
          $serverDirectory = "$env:BATCHES_SHARE\Batches\$env:BATCH"
          $runPath = "D:\Jenkins\$env:BATCH"

          & robocopy.exe "$env:BATCHES_SHARE\Tools" 'D:\Jenkins\Tools' /E /ZB /MIR /R:3 /W:5 | Out-Host
          $toolsCode = $LASTEXITCODE
          if ($toolsCode -ge 8) {
            throw "Copying Tools failed with robocopy exit code $toolsCode."
          }

          & robocopy.exe $serverDirectory $runPath /E /ZB /MIR /R:3 /W:5 | Out-Host
          $batchCode = $LASTEXITCODE
          if ($batchCode -ge 8) {
            throw "Copying $env:BATCH failed with robocopy exit code $batchCode."
          }
          $global:LASTEXITCODE = 0

      - name: CheckRunningOnNode
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          CheckRunningOnNode

      - name: WarnUser
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          KillTasks

      - name: RestartSidePC
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          $runPath = "D:\Jenkins\$env:BATCH"
          StartTestsFromBatch $runPath $env:SYSTEM_NAME $env:BATCH
