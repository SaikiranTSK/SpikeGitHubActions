  workflow_dispatch:
    inputs:
      SystemName:
        description: Side PC (runner name / label)
        required: true
        type: choice
        options:
          - Technopolis6
          - Technopolis5
          - BV3
          - AntonPieck
          - AntonMauve-VTM
          - AlanTuring
          - AlbertCuyp
          - CarelFabritius
          - Corneille
          - DickBruna
          - DevOps2
          - Escher
          - FransHals
          - GerardVanHonthorst
          - IsaacIsraels
          - JanToorop
          - JeroenBosch
          - JohannesVermeer
          - JudithLeyster
          - Pagode
          - PaulusPotter
          - PietMondriaan
          - Rotterdam
          - Technopolis4
          - Technopolis7
          - WillemDeKooning
          - JozefIsraels
          - AntonMauve-STM
          - JacobVanCampen
          - MariaVanOosterwijck
          - VTP01_BLR
          - JacobVanRuisdael
          - JanSteen
          - CornelisSpringer
          - TheoVanDoesburg
          - PieterBrueghel
          - JacobVanCampen-VTM
          - BarendCornelisKoekkoek
          - VTP02_BLR
          - Needle_BLR
          - Pinwheel_BLR
          - Whirlpool_BLR
          - Triangulum_BLR
          - Blackeye_BLR
          - Kratu_BLR
          - Helix_BLR
          - Cartwheel_BLR
          - RembrandtVanRijn
          - Tadpole_BLR
          - Cigar_BLR
          - SystemTest_VirtualAzurion
          - Garga_BLR
          - VincentVanGogh
          - HendrikWillemMesdag-2STM
          - HendrikWillemMesdag-STM
          - Kanva
          - SystemTest_VirtualAzurion_2
          - EL_Capitan
          - China_System
          - VASys01_BLR
          - Spindle_BLR
          - Cosmos_BLR
          - Butterfly_BLR
          - Sunflower_BLR
          - Pandora
          - Comet_BLR
          - Bhargava_BLR
      Branch:
        description: Legacy build branch selector; installation uses FastMsiPath instead.
        required: true
        type: choice
        default: master
        options:
          - master
          - release-Azurion-R3.0
          - release-31.x
          - release-Azurion-R3.5
          - release-Azurion-R5.0
      UseInstalledPDC:
        description: Skip the FAST installation and use the FAST already installed
        required: false
        type: boolean
        default: false
      FastMsiPath:
        description: Local runner path to an approved FAST MSI (required unless UseInstalledPDC is checked)
        required: false
        type: string
        default: ''
      FastMsiSha256:
        description: Expected SHA-256 of FastMsiPath (required unless UseInstalledPDC is checked)
        required: false
        type: string
        default: ''
      JobName:
        description: Test batch to run (ignored when RunAllJobs is checked)
        required: true
        type: choice
        options:
          - AcquisitionMain
          - AcceptanceTesting
          - GeoMain
          - PerformanceMain
          - ServiceWorkflowBatch01_Main
          - ServiceWorkflowBatch02_Main
          - ServiceWorkflowBatch03_Main
          - ServiceWorkflowBatch04_Main
          - ServiceWorkflowBatch05_Main
          - ServiceWorkflowBatch06_Main
          - ServiceWorkflowBatch07_Main
          - HospitalWorkFlowBatch01_Main
          - HospitalWorkFlowBatch02_Main
          - HospitalWorkFlowBatch03_Main
          - HospitalWorkFlowBatch04_Main
          - HospitalWorkflowMasterBatch01_Main
          - LicensesMain
          - ViewingMain
          - FlexibleViewingMain
          - AcquisitionMainlineDaily
          - PerformanceMainlineDaily
          - GeoMainlineDaily
          - HospitalWorkFlowMainlineDaily
          - ServiceWorkflowBatch01_MainlineDaily
          - ServiceWorkflowBatch02_MainlineDaily
          - LicensesMainlineDaily
          - ViewingMainlineDaily
          - FlexibleViewingMainlineDaily
          - ReliabilityMain
          - iProcedureMain
          - RestoreMain
          - HospitalWorkflowBatch01_MainlineDaily
          - ProcessingMain
          - iXrayControlMain
      RunAllJobs:
        description: Run every job in AllJobs (in order) instead of JobName
        required: false
        type: boolean
        default: false
      AllJobs:
        description: Comma separated job names used when RunAllJobs is checked
        required: false
        type: string
        default: AcquisitionMain,PerformanceMain,GeoMain,FlexibleViewingMain,ViewingMain,ServiceWorkflowBatch01_Main,ServiceWorkflowBatch02_Main,ServiceWorkflowBatch03_Main,ReliabilityMain
      TestCategories:
        description: "Viewing only: enter NUnit categories or a filter. Leave blank for defaults; Test.PreLoop.Generic and Test.PostLoop.Generic are added automatically."
        required: false
        type: string
        default: ''
      TEST_END_TIME:
        description: Defines test end time to update Hooks.ini (YYYY-MM-DD HH:mm).
        required: false
        type: string
        default: ''
      RestoreName:
        description: Backup folder name (RestoreMain only)
        required: false
        type: string
        default: ''
      RestoreFromLocation:
        description: Local runner folder containing the RestoreName backup; network paths are not supported.
        required: false
        type: string
        default: ''

  # Same pipeline, called by ExternalInterfaceAutomation.yml (Jenkins job with the same stages).
  workflow_call:
    inputs:
      SystemName: { type: string, required: true }
      Branch: { type: string, required: false, default: master }
      UseInstalledPDC: { type: boolean, required: false, default: false }
      FastMsiPath: { type: string, required: false, default: '' }
      FastMsiSha256: { type: string, required: false, default: '' }
      JobName: { type: string, required: true }
      RunAllJobs: { type: boolean, required: false, default: false }
      AllJobs: { type: string, required: false, default: '' }
      TestCategories: { type: string, required: false, default: '' }
      TEST_END_TIME: { type: string, required: false, default: '' }
      RestoreName: { type: string, required: false, default: '' }
      RestoreFromLocation: { type: string, required: false, default: '' }
      SkipHooksIni:
        description: Do not touch TestEndDateTime in Hooks.ini
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check-runner:
    uses: ./.github/workflows/check-runner.yml
    with:
       system-name: ${{ inputs.SystemName }}
    secrets: inherit

  run-tests:
    name: MainlineTeamTests on ${{ inputs.SystemName }}
    needs: check-runner
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, Windows, '${{ inputs.SystemName }}']
    # lock(resource: "lock_" + SystemName): no concurrency group on purpose. The side PC has one runner, so jobs for it
    # wait in the runner queue one after the other, like the Jenkins lock queue. A concurrency group would keep only
    # one pending run and cancel the others.
    # Jenkins has no time limit (runs up to 46 h seen). 7200 min = 5 days = GitHub maximum for self-hosted jobs.
    timeout-minutes: 7200
    # Same 4 stages as the Jenkins Stage View; each stage is one step running one numbered script.
    defaults:
      run:
        shell: powershell
    env:
      SCRIPTS: ${{ github.workspace }}\.github\scripts\MainlineTeamTests
      SYSTEM_NAME: ${{ inputs.SystemName }}
      JOB_TITLE: ${{ inputs.RunAllJobs && 'AllJobs' || inputs.JobName }}
      BRANCH: ${{ inputs.Branch }}
      USE_INSTALLED_PDC: ${{ inputs.UseInstalledPDC }}
      FAST_MSI_PATH: ${{ inputs.FastMsiPath }}
      FAST_MSI_SHA256: ${{ inputs.FastMsiSha256 }}
      MAINLINE_TEAM_TESTS: 'true'
      SKIP_HOOKS_INI: ${{ inputs.SkipHooksIni }}
      JOB_NAME: ${{ inputs.JobName }}
      ALL_JOBS: ${{ inputs.AllJobs }}
      RUN_ALL_JOBS: ${{ inputs.RunAllJobs }}
      TEST_CATEGORIES: ${{ inputs.TestCategories }}
      TEST_END_TIME: ${{ inputs.TEST_END_TIME }}
      RESTORE_NAME: ${{ inputs.RestoreName }}
      RESTORE_FROM_LOCATION: ${{ inputs.RestoreFromLocation }}
    steps:
      # No separate checkout step (Jenkins has none either): the first stage downloads the .github scripts itself
      # with git (sparse, depth 1, token not saved on the PC), so there is no "Get pipeline scripts" / "Post" step.
      - name: Stage repository-owned tools
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $auth = 'AUTHORIZATION: basic ' + [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GIT_TOKEN"))
          if (Test-Path "$ws\.git") { Remove-Item "$ws\.git" -Recurse -Force }
          git init -q "$ws"
          git -C "$ws" config core.sparseCheckout true
          Set-Content -LiteralPath "$ws\.git\info\sparse-checkout" -Value '/.github/' -Encoding ascii
          git -C "$ws" -c "http.extraheader=$auth" fetch -q --depth 1 --no-tags "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY" $env:GITHUB_SHA
          if ($LASTEXITCODE) { Write-Host "::error::Could not download pipeline scripts ($env:GITHUB_SHA)."; exit $LASTEXITCODE }
          git -C "$ws" checkout -q --force FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C "$ws" clean -ffdxq
          & "$env:SCRIPTS\01__CopyToolsFromShare.ps1"
          
      - name: Check running on node
        run: '& "$env:SCRIPTS\02__CheckRunningOnNode.ps1"'

      - name: Prepare Environment
        run: '& "$env:SCRIPTS\03__PrepareEnvironment.ps1"'

      - name: Execute Tests and Copy Results
        run: '& "$env:SCRIPTS\04__ExecuteTestsAndCopyResults.ps1"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MainlineTeamTests-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.SystemName }}
          path: ${{ runner.temp }}\MainlineTeamTests\results
          if-no-files-found: warn
