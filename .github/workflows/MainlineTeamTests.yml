# GitHub Actions version of Jenkins\PipelineScriptBackup\MainlineTeamTests.groovy
# Docs: docs\pipelines\MainlineTeamTests.md
name: MainlineTeamTests
run-name: ${{ inputs.ScheduleOnly && format('Schedule at {0} UTC - ', inputs.RunAtUtc) || '' }}${{ inputs.SystemName }} - ${{ inputs.RunAllJobs && 'AllJobs' || inputs.JobName }}

on:
  workflow_dispatch:
    inputs:
      SystemName:
        description: Side PC (runner name / label)
        required: true
        type: choice
        options:
          - AntonMauve-VTM
          - VTP01_BLR
          - Kanva_BLR
          - Bhargava_BLR
      Branch:
        description: Exact name of the folder that can be found here:\\code1.emi.philips.com\storage\IGTS_WIP_Storage\CIBuilds\TestTooling
        required: true
        type: choice
        default: master
        options:
          - master
          - release-Azurion-R3.0
          - release-31.x
          - release-Azurion-R3.5
          - release-Azurion-R5.0
      UseInstalledPDC:
        description: Skip the FAST installation and use the FAST already installed
        required: false
        type: boolean
        default: false
      JobName:
        description: Test batch to run (ignored when RunAllJobs is checked)
        required: true
        type: choice
        options:
          - AcquisitionMain
          - AcceptanceTesting
          - GeoMain
          - PerformanceMain
          - ServiceWorkflowBatch01_Main
          - ServiceWorkflowBatch02_Main
          - ServiceWorkflowBatch03_Main
          - ServiceWorkflowBatch04_Main
          - ServiceWorkflowBatch05_Main
          - ServiceWorkflowBatch06_Main
          - ServiceWorkflowBatch07_Main
          - HospitalWorkFlowBatch01_Main
          - HospitalWorkFlowBatch02_Main
          - HospitalWorkFlowBatch03_Main
          - HospitalWorkFlowBatch04_Main
          - HospitalWorkflowMasterBatch01_Main
          - LicensesMain
          - ViewingMain
          - FlexibleViewingMain
          - AcquisitionMainlineDaily
          - PerformanceMainlineDaily
          - GeoMainlineDaily
          - HospitalWorkFlowMainlineDaily
          - ServiceWorkflowBatch01_MainlineDaily
          - ServiceWorkflowBatch02_MainlineDaily
          - LicensesMainlineDaily
          - ViewingMainlineDaily
          - FlexibleViewingMainlineDaily
          - ReliabilityMain
          - iProcedureMain
          - RestoreMain
          - HospitalWorkflowBatch01_MainlineDaily
          - ProcessingMain
          - iXrayControlMain
      RunAllJobs:
        description: Run every job in AllJobs (in order) instead of JobName
        required: false
        type: boolean
        default: false
      AllJobs:
        description: Comma separated job names used when RunAllJobs is checked
        required: false
        type: string
        default: AcquisitionMain,PerformanceMain,GeoMain,FlexibleViewingMain,ViewingMain,ServiceWorkflowBatch01_Main,ServiceWorkflowBatch02_Main,ServiceWorkflowBatch03_Main,ReliabilityMain
      TestCategories:
        description: "Viewing only: enter NUnit categories or a filter. Leave blank for defaults; Test.PreLoop.Generic and Test.PostLoop.Generic are added automatically."
        required: false
        type: string
        default: ''
      TEST_END_TIME:
        description: Defines test end time to update Hooks.ini (YYYY-MM-DD HH:mm).
        required: false
        type: string
        default: ''
      RestoreName:
        description: Backup folder name (RestoreMain only)
        required: false
        type: string
        default: ''
      RestoreFromLocation:
        description: Name of the backup to be restored.Example CV_722079_STM2014_11122024015157_fd16
                     This value must match the backup folder name available in RestoreFromLocation.
        required: false
        type: string
        default: \\code1.emi.philips.com\storage\SDI_Publish\TestSystems\Backups
      # One-time dynamic scheduling ("run at this time"). GitHub cron cannot take runtime inputs, so with
      # ScheduleOnly the inputs above are saved in .github/schedules/mainline-team-tests-queue.json and
      # MainlineTeamTestsScheduler.yml dispatches this workflow with them once RunAtUtc is reached.
      ScheduleOnly:
        description: Do not run now; schedule a one-time run at RunAtUtc with the inputs above
        required: false
        type: boolean
        default: false
      RunAtUtc:
        description: "Start time in UTC (YYYY-MM-DD HH:mm), required when ScheduleOnly is checked"
        required: false
        type: string
        default: ''

  # Same pipeline, called by ExternalInterfaceAutomation.yml (Jenkins job with the same stages).
  workflow_call:
    inputs:
      SystemName: { type: string, required: true }
      Branch: { type: string, required: false, default: master }
      UseInstalledPDC: { type: boolean, required: false, default: false }
      JobName: { type: string, required: true }
      RunAllJobs: { type: boolean, required: false, default: false }
      AllJobs: { type: string, required: false, default: '' }
      TestCategories: { type: string, required: false, default: '' }
      TEST_END_TIME: { type: string, required: false, default: '' }
      RestoreName: { type: string, required: false, default: '' }
      RestoreFromLocation: { type: string, required: false, default: '' }
      SkipHooksIni:
        description: Do not touch TestEndDateTime in Hooks.ini
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  # ScheduleOnly: append this request to the queue file on the default branch; no tests run in this run.
  schedule-request:
    name: Schedule ${{ inputs.SystemName }} at ${{ inputs.RunAtUtc }} UTC
    if: ${{ inputs.ScheduleOnly }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      QUEUE_FILE: .github/schedules/mainline-team-tests-queue.json
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_AT_UTC: ${{ inputs.RunAtUtc }}
      SYSTEM_NAME: ${{ inputs.SystemName }}
      BRANCH: ${{ inputs.Branch }}
      USE_INSTALLED_PDC: ${{ inputs.UseInstalledPDC }}
      JOB_NAME: ${{ inputs.JobName }}
      RUN_ALL_JOBS: ${{ inputs.RunAllJobs }}
      ALL_JOBS: ${{ inputs.AllJobs }}
      TEST_CATEGORIES: ${{ inputs.TestCategories }}
      TEST_END_TIME: ${{ inputs.TEST_END_TIME }}
      RESTORE_NAME: ${{ inputs.RestoreName }}
      RESTORE_FROM_LOCATION: ${{ inputs.RestoreFromLocation }}
    steps:
      - name: Validate RunAtUtc
        id: when
        run: |
          set -euo pipefail
          run_at="$(sed 's/^[[:space:]]*//; s/[[:space:]]*$//' <<< "$RUN_AT_UTC")"
          if ! [[ "$run_at" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{2}:[0-9]{2}$ ]] ||
             [ "$(date -u -d "$run_at UTC" '+%Y-%m-%d %H:%M' 2>/dev/null)" != "$run_at" ]; then
            echo "::error::RunAtUtc '$RUN_AT_UTC' is missing or invalid. Use UTC format YYYY-MM-DD HH:mm, e.g. 2026-01-31 18:30."
            exit 1
          fi
          iso="$(date -u -d "$run_at UTC" +%Y-%m-%dT%H:%M:%SZ)"
          if [ "$(date -u -d "$run_at UTC" +%s)" -le "$(date -u +%s)" ]; then
            echo "::warning::RunAtUtc $run_at is in the past; the run starts at the next scheduler check."
          fi
          echo "iso=$iso" >> "$GITHUB_OUTPUT"

      - name: Get queue file
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/schedules

      - name: Add request to queue
        shell: bash
        env:
          RUN_AT_ISO: ${{ steps.when.outputs.iso }}
        run: |
          set -euo pipefail
          entry=$(jq -n \
            --arg id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --arg createdAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg runAtUtc "$RUN_AT_ISO" \
            --arg requestedBy "$GITHUB_ACTOR" \
            '{id: $id, createdAt: $createdAt, runAtUtc: $runAtUtc, requestedBy: $requestedBy, inputs: {
                SystemName: env.SYSTEM_NAME, Branch: env.BRANCH, UseInstalledPDC: (env.USE_INSTALLED_PDC == "true"),
                JobName: env.JOB_NAME, RunAllJobs: (env.RUN_ALL_JOBS == "true"), AllJobs: env.ALL_JOBS,
                TestCategories: env.TEST_CATEGORIES, TEST_END_TIME: env.TEST_END_TIME,
                RestoreName: env.RESTORE_NAME, RestoreFromLocation: env.RESTORE_FROM_LOCATION}}')
          echo "$entry" | jq .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          max_attempts=5
          for ((attempt=1; attempt<=max_attempts; attempt++)); do
            echo "Queue update attempt $attempt/$max_attempts on $DEFAULT_BRANCH."
            # Rebuild from the latest queue after conflicts; never force-push or overwrite concurrent requests.
            if ! git fetch --depth=1 origin "$DEFAULT_BRANCH" ||
               ! git reset --hard FETCH_HEAD; then
              echo "::warning::Could not sync $DEFAULT_BRANCH on attempt $attempt/$max_attempts."
            else
              mkdir -p "$(dirname "$QUEUE_FILE")"
              [ -s "$QUEUE_FILE" ] || echo '[]' > "$QUEUE_FILE"
              # Preserve an already-persisted request, including its original creation time.
              jq --argjson e "$entry" \
                'if any(.[]; .id == $e.id) then . else . + [$e] | sort_by(.runAtUtc) end' \
                "$QUEUE_FILE" > "$RUNNER_TEMP/queue.json"
              mv "$RUNNER_TEMP/queue.json" "$QUEUE_FILE"
              if ! git add "$QUEUE_FILE"; then
                echo "::warning::Could not stage $QUEUE_FILE on attempt $attempt/$max_attempts."
              elif git diff --cached --quiet -- "$QUEUE_FILE"; then
                echo "::notice::No queue changes needed; request $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT is already queued."
                exit 0
              elif ! git commit -m "Schedule MainlineTeamTests on $SYSTEM_NAME at $RUN_AT_ISO"; then
                echo "::warning::Could not commit $QUEUE_FILE on attempt $attempt/$max_attempts; see git output above."
              elif git push origin "HEAD:$DEFAULT_BRANCH"; then
                echo "::notice::Scheduled MainlineTeamTests on $SYSTEM_NAME at $RUN_AT_ISO (request $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT)."
                exit 0
              else
                echo "::warning::Could not push $QUEUE_FILE on attempt $attempt/$max_attempts; check git output for conflicts, contents: write permission, or branch protection."
              fi
            fi
            # Back off before retrying against fresh remote state, but do not delay the final failure.
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 5))
            fi
          done
          echo "::error::Could not update $QUEUE_FILE on $DEFAULT_BRANCH after $max_attempts attempts; see git diagnostics above."
          exit 1

  check-runner:
    if: ${{ !inputs.ScheduleOnly }}
    uses: ./.github/workflows/check-runner.yml
    with:
       system-name: ${{ inputs.SystemName }}
    secrets: inherit

  run-tests:
    name: MainlineTeamTests on ${{ inputs.SystemName }}
    needs: check-runner
    if: ${{ !failure() && !cancelled() && !inputs.ScheduleOnly }}
    runs-on: [self-hosted, Windows, '${{ inputs.SystemName }}']
    # lock(resource: "lock_" + SystemName): no concurrency group on purpose. The side PC has one runner, so jobs for it
    # wait in the runner queue one after the other, like the Jenkins lock queue. A concurrency group would keep only
    # one pending run and cancel the others.
    # Jenkins has no time limit (runs up to 46 h seen). 7200 min = 5 days = GitHub maximum for self-hosted jobs.
    timeout-minutes: 7200
    # Fetch repo tooling into the workspace, then run the three numbered execution stages.
    defaults:
      run:
        shell: powershell
    env:
      SCRIPTS: ${{ github.workspace }}\.github\scripts\MainlineTeamTests
      SYSTEM_NAME: ${{ inputs.SystemName }}
      JOB_TITLE: ${{ inputs.RunAllJobs && 'AllJobs' || inputs.JobName }}
      BRANCH: ${{ inputs.Branch }}
      USE_INSTALLED_PDC: ${{ inputs.UseInstalledPDC }}
      SKIP_HOOKS_INI: ${{ inputs.SkipHooksIni }}
      JOB_NAME: ${{ inputs.JobName }}
      ALL_JOBS: ${{ inputs.AllJobs }}
      RUN_ALL_JOBS: ${{ inputs.RunAllJobs }}
      TEST_CATEGORIES: ${{ inputs.TestCategories }}
      TEST_END_TIME: ${{ inputs.TEST_END_TIME }}
      RESTORE_NAME: ${{ inputs.RestoreName }}
      RESTORE_FROM_LOCATION: ${{ inputs.RestoreFromLocation }}
    steps:
      # Hard cutover: fetch .github once and execute in place; no DataPath tooling copy.
      # Sparse, depth 1, token not saved on the PC.
      - name: Get pipeline scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          
      - name: Check running on node
        run: '& "$env:SCRIPTS\02__CheckRunningOnNode.ps1"'

      - name: Prepare Environment
        run: '& "$env:SCRIPTS\03__PrepareEnvironment.ps1"'

      - name: Execute Tests and Copy Results
        run: '& "$env:SCRIPTS\04__ExecuteTestsAndCopyResults.ps1"'
