jobs:
  plan:
    name: Find due schedules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.plan.outputs.due }}
    steps:
      - id: plan
        name: Find due schedules
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python3 {0}
        run: |
          import json, os, re, urllib.parse, urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo, ZoneInfoNotFoundError
          AMS = "Europe/Amsterdam"
          GRACE = timedelta(hours=2)
          DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
          KEY = re.compile(r"\[([a-z0-9]+@[0-9T:-]+)\]$")
          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          REPO = os.environ["GITHUB_REPOSITORY"]


          def parse_time(text):
              return datetime.fromisoformat(text.replace("Z", "+00:00")).astimezone(timezone.utc)


          NOW = parse_time(os.environ["WR_NOW"]) if os.environ.get("WR_NOW") else datetime.now(timezone.utc)


          def get(path):
              req = urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)


          def items(path, field):
              page = 1
              separator = "&" if "?" in path else "?"
              while True:
                  data = get(f"{path}{separator}per_page=100&page={page}")
                  batch = data[field]
                  yield from batch
                  if len(batch) < 100:
                      return
                  page += 1


          def zone_of(s):
              # Date and time are in the time zone of the person who saved the schedule. Older schedules: Amsterdam.
              try:
                  return ZoneInfo(s.get("zone") or AMS)
              except (ZoneInfoNotFoundError, ValueError, OSError):
                  return None


          def to_utc(local, tz):
              # A time skipped when the clocks go forward does not exist. A time that happens twice
              # when the clocks go back uses the second one (winter time), like the app.
              utc = local.replace(tzinfo=tz, fold=1).astimezone(timezone.utc)
              return utc if utc.astimezone(tz).replace(tzinfo=None) == local else None


          def starts(s, tz, lo, hi):
              hour, minute = map(int, s["time"].split(":"))
              since = parse_time(s["since"])
              day = lo.astimezone(tz).date() - timedelta(days=1)
              last = hi.astimezone(tz).date() + timedelta(days=1)
              while day <= last:
                  if (s["repeat"] == "once" and day.isoformat() == s.get("date")) or (
                          s["repeat"] == "weekly" and DAYS[day.weekday()] in (s.get("days") or [])):
                      local = datetime(day.year, day.month, day.day, hour, minute)
                      due = to_utc(local, tz)
                      if due and lo <= due <= hi and due > since:
                          yield local, due
                  day += timedelta(days=1)


          def run_inputs(s, local):
              inputs = dict(s.get("inputs") or {})
              for name, value in (s.get("times") or {}).items():
                  hour, minute = map(int, value.split(":"))
                  at = local.replace(hour=hour, minute=minute)
                  if at <= local:
                      at += timedelta(days=1)
                  inputs[name] = at.strftime("%Y-%m-%d %H:%M")
              return inputs


          def already_started(since, wanted):
              keys = set()
              # A dispatcher can be created long before it starts a due occurrence.
              # Filter by its last update, not creation time, and page through all runs.
              path = f"/repos/{REPO}/actions/workflows/ScheduledTests.yml/runs"
              for run in items(path, "workflow_runs"):
                  if str(run["id"]) == os.environ.get("GITHUB_RUN_ID"):
                      continue
                  if parse_time(run["updated_at"]) < since:
                      continue
                  for job in items(f"/repos/{REPO}/actions/runs/{run['id']}/jobs?filter=all", "jobs"):
                      match = KEY.search(job.get("name") or "")
                      if match and match.group(1) in wanted and job.get("conclusion") == "success":
                          keys.add(match.group(1))
                  if wanted <= keys:
                      break
              return keys


          due = []
          for s in json.loads(os.environ["SCHEDULES"]):
              if s.get("paused"):
                  continue
              tz = zone_of(s)
              if tz is None:
                  print(f"::warning title=Unknown time zone::{s['name'][:40]}: {s.get('zone')}")
                  continue
              for local, at in starts(s, tz, NOW - GRACE, NOW):
                  key = f"{s['id']}@{local:%Y-%m-%dT%H:%M}"
                  due.append((at, {
                      "key": key,
                      "label": f"{s['name'][:40]} - {local:%a %d %b %H:%M} [{key}]",
                      "workflow": s["workflow"],
                      "ref": s["ref"],
                      "inputs": run_inputs(s, local),
                  }))
          due.sort(key=lambda d: d[0])

          done = already_started(due[0][0], {item["key"] for _, item in due}) if due else set()
          todo = [item for _, item in due if item["key"] not in done][:100]
          print(f"Now: {NOW:%Y-%m-%d %H:%M} UTC")
          for _, item in due:
              print(f"{item['key']}: {'already started' if item['key'] in done else 'start now'}")
          if not due:
              print("Nothing is due.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("due=" + json.dumps(todo) + "\n")

  start:
    needs: plan
    if: needs.plan.outputs.due != '[]'
    name: ${{ matrix.item.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.due) }}
    steps:
      - name: Start the workflow
        env:
          GH_TOKEN: ${{ github.token }}
          ITEM: ${{ toJSON(matrix.item) }}
        shell: python3 {0}
        run: |
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com").rstrip("/")
          REPO = os.environ["GITHUB_REPOSITORY"]
          item = json.loads(os.environ["ITEM"])


          def esc(text):
              return str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          what = f"{esc(item['workflow'])} on {esc(item['ref'])}"
          result = {"key": item["key"], "workflow": item["workflow"], "ref": item["ref"], "inputs": item["inputs"]}
          code = 0
          req = urllib.request.Request(
              f"{API}/repos/{REPO}/actions/workflows/{urllib.parse.quote(item['workflow'])}/dispatches",
              data=json.dumps({"ref": item["ref"], "inputs": item["inputs"], "return_run_details": True}).encode(),
              method="POST",
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              })
          try:
              with urllib.request.urlopen(req, timeout=60) as res:
                  body = res.read()
              data = json.loads(body) if body else {}
              result.update(ok=True, runId=data.get("workflow_run_id"), url=data.get("html_url"))
              print(f"::notice title=Started::{what} {esc(data.get('html_url') or '')}")
          except urllib.error.HTTPError as e:
              try:
                  detail = str(json.loads(e.read() or b"{}").get("message") or e.reason)
              except ValueError:
                  detail = str(e.reason)
              # GitHub busy or rate limit: fail this job so the next wake-up tries again. Other errors are final.
              retry = e.code in (429, 502, 503, 504) or "rate limit" in detail.lower()
              result.update(ok=False, status=e.code, error=f"HTTP {e.code}: {detail}", retry=retry)
              print(f"::error title=Not started::{what}: HTTP {e.code} {esc(detail)}")
              code = 1 if retry else 0
          except Exception as e:
              # No clear answer: the run may have started, so it is not tried again.
              result.update(ok=None, error=str(e))
              print(f"::warning title=Not confirmed::{what}: {esc(e)}")
          print("WR_RESULT " + json.dumps(result))
          sys.exit(code)
