# GitHub Actions version of the live Jenkins job TestStarterDevelopment (family D).
# Jenkins: inline pipeline script (copy: Jenkins\Batches\TestStarterDevelopment\TestStarterDevelopment.Jenkinsfile) that loads
# <DataPath>Batches\TestStarterDevelopment\TestStarterDevelopmentStages.groovy on the side PC.
# GitHub Actions always uses .github\scripts\Shared\TestStarterDevelopmentStages.ps1.
# Each Jenkins stage is one step with the same name, running one numbered script from .github\scripts\TestStarterDevelopment\.
# Jenkins parameters, types and defaults, except the fixed stages script (SystemName is a free text field there too).
# Remote trigger (Jenkins authToken): POST /repos/{owner}/{repo}/actions/workflows/TestStarterDevelopment.yml/dispatches.
# Docs: docs\pipelines\TestStarterDevelopment.md, docs\migration\Family-D-TestStarterDevelopment.md
name: TestStarterDevelopment
run-name: ${{ inputs.SystemName }}

on:
  workflow_dispatch:
    inputs:
      Batch:
        description: Batch that will be run
        required: false
        type: string
        default: TestStarterDevelopment
      TestsLocation:
        description: Location (folder) of tests to be run
        required: false
        type: string
        default: '"\\nlybstqvp1ms368\misc\Lisa\FASTAcceptance\Acceptance"'
      TestLibrary:
        description: Name of the dll (including the .dll)
        required: false
        type: string
        default: FAST.SystemTests.Acceptance.dll
      TestParameters:
        description: Parameters for the test to be run (for example "/include:Test.PreLoop.Generic,Test.PreLoop.Acquisition,Test.PreLoop.Geometry,Test.Batch,Test.PostLoop.Generic")
        required: false
        type: string
        default: '"/include:Test.PreLoop.Generic,Test.PreLoop.Acquisition,Test.PreLoop.Geometry,Test.Batch.Acceptance,Test.PostLoop.Generic"'
      AssignedId:
        description: With /runlist:testlist.txt -> /runlist:C:\Temp\FAST\Tests\<AssignedId>.txt
        required: false
        type: string
        default: ''
      SaveLocation:
        description: Copy to Nightbatch Location
        required: false
        type: string
        default: file://code1.emi.philips.com/storage/IGTs_Nightbatch/Nightbatch/
      SystemName:
        description: The system on which you would like to run on.(Runner Name)
        required: true
        type: string
        default: ''
      Loops:
        description: Amount of loops to apply at the test
        required: false
        type: string
        default: '1'
      NUnitVersion:
        description: Not used (the NUnit version is detected from nunit.framework.dll)
        required: false
        type: string
        default: NUnit 2.6.2
      SaveScreenshotsAndVideosToLocation:
        description: Optional. If required, captured images/videos are also copied to the saveLocation value.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # It will check the Runner was Online."
  check-runner:
    uses: ./.github/workflows/check-runner.yml
    with:
      system-name: ${{ inputs.SystemName }}
    secrets: inherit

  pipeline:
    name: TestStarterDevelopment on ${{ inputs.SystemName }}
    needs: check-runner
    if: ${{ !failure() && !cancelled() }}
    runs-on: [self-hosted, Windows, '${{ inputs.SystemName }}']
    # lock("lock_"+SystemName): no concurrency group on purpose. The side PC has one runner, so jobs for it wait in
    # the runner queue one after the other, like the Jenkins lock queue (a concurrency group cancels pending runs).
    # Jenkins has no timeout; Loops x a full batch can take more than a day.
    timeout-minutes: 7200
    defaults:
      run:
        shell: powershell
    env:
      SCRIPTS: ${{ github.workspace }}\.github\scripts\TestStarterDevelopment
      RESULT_VIEWER_URL: ${{ vars.RESULT_VIEWER_URL || 'http://igts-resultviewer.ta.philips.com/#/testrun/' }}
      SYSTEM_NAME: ${{ inputs.SystemName }}
      BATCH: ${{ inputs.Batch }}
      TESTS_LOCATION: ${{ inputs.TestsLocation }}
      TEST_LIBRARY: ${{ inputs.TestLibrary }}
      TEST_PARAMETERS: ${{ inputs.TestParameters }}
      ASSIGNED_ID: ${{ inputs.AssignedId }}
      SAVE_LOCATION: ${{ inputs.SaveLocation }}
      LOOPS: ${{ inputs.Loops }}
      NUNIT_VERSION: ${{ inputs.NUnitVersion }}
      SAVE_SCREENSHOTS_AND_VIDEOS_TO_LOCATION: ${{ inputs.SaveScreenshotsAndVideosToLocation }}
    steps:
      - name: Get pipeline scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Prepare Node
        run: '& "$env:SCRIPTS\01__PrepareNode.ps1"'

      - name: Prepare Environment
        run: '& "$env:SCRIPTS\02__PrepareEnvironment.ps1"'

      - name: Execute Tests
        id: execute-tests
        run: '& "$env:SCRIPTS\03__ExecuteTests.ps1"'

      - name: Execute Tests After Cancel
        if: ${{ cancelled() && steps.execute-tests.outcome == 'cancelled' }}
        run: '& "$env:SCRIPTS\04__ExecuteTestsAfterCancel.ps1"'
