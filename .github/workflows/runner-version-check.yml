name: runner-version-check

on:
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: runner-version-check
  cancel-in-progress: false

env:
  BASE_BRANCH: main
  RUNNER_DIR: GitHub-Runner-Client
  TRACKED_FILES: |
    GitHub-Runner-Client/install.ps1
    GitHub-Runner-Client/readme.txt

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the target branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Decide whether a PR is needed
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          mapfile -t current_versions < <(
            grep -oP '\$RunnerVersion\s*=\s*['"'"'"]\K[0-9]+\.[0-9]+\.[0-9]+(?=['"'"'"])' \
              "$RUNNER_DIR/install.ps1"
          )

          if [ "${#current_versions[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one RunnerVersion assignment in install.ps1."
            exit 1
          fi

          current="${current_versions[0]}"

          if [[ ! "$current" =~ $version_pattern ]]; then
            echo "::error::Invalid installed-version default: '$current'"
            exit 1
          fi

          release=$(gh api repos/actions/runner/releases/latest)

          if ! jq -e '
            .draft == false and
            .prerelease == false and
            (.tag_name | type == "string")
          ' <<< "$release" > /dev/null; then
            echo "::error::The release response is not a published stable release."
            exit 1
          fi

          tag=$(jq -r '.tag_name' <<< "$release")

          if [[ "$tag" != v* ]]; then
            echo "::error::Unexpected runner release tag: '$tag'"
            exit 1
          fi

          latest="${tag#v}"

          if [[ ! "$latest" =~ $version_pattern ]]; then
            echo "::error::Unexpected runner release version: '$latest'"
            exit 1
          fi

          package="actions-runner-win-x64-$latest.zip"

          if ! jq -e --arg package "$package" '
            any(
              .assets[];
              .name == $package and
              .state == "uploaded" and
              .size > 0
            )
          ' <<< "$release" > /dev/null; then
            echo "::error::Release '$tag' has no uploaded Windows x64 package."
            exit 1
          fi

          act=false
          branch="runner-update-$latest"

          if [ "$current" = "$latest" ]; then
            reason="Already on the latest release - no PR"
          else
            newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)

            if [ "$newest" != "$latest" ]; then
              reason="Repository version is newer than the latest release - no downgrade"
            else
              owner="${GH_REPO%%/*}"

              prs=$(
                gh api --method GET --paginate --slurp \
                  "repos/$GH_REPO/pulls" \
                  -f state=all \
                  -f base="$BASE_BRANCH" \
                  -f head="$owner:$branch" \
                  -f per_page=100
              )

              matching=$(
                jq --arg repo "$GH_REPO" --arg branch "$branch" '
                  [
                    .[][] |
                    select(
                      .head.repo.full_name == $repo and
                      .head.ref == $branch
                    )
                  ]
                ' <<< "$prs"
              )

              open_count=$(
                jq '[.[] | select(.state == "open")] | length' <<< "$matching"
              )

              rejected_count=$(
                jq '
                  [
                    .[] |
                    select(.state == "closed" and .merged_at == null)
                  ] | length
                ' <<< "$matching"
              )

              if [ "$open_count" -gt 0 ]; then
                reason="An update PR for this release is already open - no duplicate"
              elif [ "$rejected_count" -gt 0 ]; then
                reason="An update PR for this release was closed without merging - not reopening"
              else
                act=true
                reason="New verified release - opening an update PR"
              fi
            fi
          fi

          {
            echo "current=$current"
            echo "latest=$latest"
            echo "branch=$branch"
            echo "act=$act"
          } >> "$GITHUB_OUTPUT"

          {
            echo "| Current | Latest stable | PR needed | Reason |"
            echo "|---|---|---|---|"
            echo "| $current | $latest | $act | $reason |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update version in tracked files
        if: steps.version.outputs.act == 'true'
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          LATEST: ${{ steps.version.outputs.latest }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          current = os.environ["CURRENT"]
          latest = os.environ["LATEST"]
          paths = [
              Path(line.strip())
              for line in os.environ["TRACKED_FILES"].splitlines()
              if line.strip()
          ]

          if not paths:
              raise SystemExit("No tracked files configured.")

          pattern = re.compile(
              rb"(?<![0-9.])"
              + re.escape(current.encode("ascii"))
              + rb"(?![0-9]|\.[0-9])"
          )

          updates = []

          for path in paths:
              if not path.is_file():
                  raise SystemExit(f"Tracked file missing: {path}")

              original = path.read_bytes()
              updated, count = pattern.subn(latest.encode("ascii"), original)

              if count == 0:
                  raise SystemExit(
                      f"{path} does not contain expected version {current}."
                  )

              updates.append((path, updated))

          for path, updated in updates:
              path.write_bytes(updated)
          PY

          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check
          git diff --stat

      - name: Open pull request
        id: pr
        if: steps.version.outputs.act == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ steps.version.outputs.branch }}
          add-paths: ${{ env.TRACKED_FILES }}
          commit-message: "Update GitHub runner to ${{ steps.version.outputs.latest }}"
          title: "Update GitHub runner to ${{ steps.version.outputs.latest }}"
          body: |
            Latest stable runner release:
            https://github.com/actions/runner/releases/tag/v${{ steps.version.outputs.latest }}

            Updates the runner version from **${{ steps.version.outputs.current }}**
            to **${{ steps.version.outputs.latest }}** in:
            - `GitHub-Runner-Client/install.ps1`
            - `GitHub-Runner-Client/readme.txt`

            The release includes the Windows x64 runner package.

            **Merging updates the repository only, not the PCs.**
            Automatic runner updates remain disabled.

            Admin checklist:
            - [ ] Read the release notes.
            - [ ] Merge this PR.
            - [ ] Download the updated client files on each PC.
            - [ ] Remove/reinstall each runner when it is not executing a job.
            - [ ] Preserve the runner name, labels, service account, proxy, and work-directory settings.
            - [ ] Confirm the installed version and GitHub Idle status.
            - [ ] Run a verification job on each updated runner.

      - name: Verify that an update PR exists
        if: steps.version.outputs.act == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$PR_NUMBER" ]; then
            echo "::error::An update was required, but no PR was created or found."
            exit 1
          fi

          echo "Update PR: #$PR_NUMBER" >> "$GITHUB_STEP_SUMMARY"
