name: RestartSidePCOnAntonMauve
run-name: ${{ inputs.SystemName || 'AntonMauve-VTM' }}_${{ inputs.Batch || 'RestartSidePC' }}

on:
  workflow_dispatch:
    inputs:
      SystemName:
        description: Side PC (runner name / label)
        required: true
        type: string
      Batch:
        description: Batch folder name
        required: true
        type: string
        default: RestartSidePC
  schedule:
    - cron: '48 19 11 11 *'

permissions:
  contents: read

env:
  BATCHES_SHARE: ${{ vars.BATCHES_SHARE || '\\nlybstqvp4dt7nv\JenkinsBatches' }}

jobs:
  schedule-guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check scheduled date
        id: check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] ||
             [[ "$(TZ=Europe/Amsterdam date +%F)" == "2026-11-11" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  check-runner:
    needs: schedule-guard
    if: ${{ needs.schedule-guard.outputs.should_run == 'true' }}
    uses: ./.github/workflows/check-runner.yml
    with:
      system-name: ${{ inputs.SystemName || 'AntonMauve-VTM' }}
    secrets: inherit

  restart-side-pc:
    name: RestartSidePC on ${{ inputs.SystemName || 'AntonMauve-VTM' }}
    needs: check-runner
    runs-on: [self-hosted, Windows, "${{ inputs.SystemName || 'AntonMauve-VTM' }}"]
    timeout-minutes: 1440
    defaults:
      run:
        shell: powershell
    env:
      SYSTEM_NAME: ${{ inputs.SystemName || 'AntonMauve-VTM' }}
      BATCH: ${{ inputs.Batch || 'RestartSidePC' }}
    steps:
      - name: Get pipeline scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: CopyRundataFromShare
        run: |
          if ($env:BATCH -notmatch '^[A-Za-z0-9][A-Za-z0-9_-]*$') {
            throw "Invalid batch folder name: $env:BATCH"
          }
          $serverDirectory = "$env:BATCHES_SHARE\Batches\$env:BATCH"
          $runPath = "D:\Jenkins\$env:BATCH"

          & robocopy.exe "$env:BATCHES_SHARE\Tools" 'D:\Jenkins\Tools' /E /ZB /MIR /R:3 /W:5 | Out-Host
          $toolsCode = $LASTEXITCODE
          if ($toolsCode -ge 8) {
            throw "Copying Tools failed with robocopy exit code $toolsCode."
          }

          & robocopy.exe $serverDirectory $runPath /E /ZB /MIR /R:3 /W:5 | Out-Host
          $batchCode = $LASTEXITCODE
          if ($batchCode -ge 8) {
            throw "Copying $env:BATCH failed with robocopy exit code $batchCode."
          }
          $global:LASTEXITCODE = 0

      - name: CheckRunningOnNode
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          CheckRunningOnNode

      - name: WarnUser
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          KillTasks

      - name: RestartSidePC
        run: |
          . "$env:GITHUB_WORKSPACE\.github\scripts\Shared\functions.ps1"
          $runPath = "D:\Jenkins\$env:BATCH"
          StartTestsFromBatch $runPath $env:SYSTEM_NAME $env:BATCH remove
