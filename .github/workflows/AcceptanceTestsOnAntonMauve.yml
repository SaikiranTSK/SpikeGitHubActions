name: AcceptanceTestsOnAntonMauve
run-name: AntonMauve-VTM - AcceptanceTesting

on:
  workflow_dispatch:
  schedule:
    # 3 runs, 2.5 hours apart. The first is 20 minutes after RestartSidePCOnAntonMauve (19:48 UTC).
    #   UTC             Netherlands     India
    #   20:08 (11 Nov)  21:08 (11 Nov)  01:38 (12 Nov)
    #   22:38 (11 Nov)  23:38 (11 Nov)  04:08 (12 Nov)
    #   01:08 (12 Nov)  02:08 (12 Nov)  06:38 (12 Nov)
    - cron: '8 20 11 11 *'
    - cron: '38 22 11 11 *'
    - cron: '8 1 12 11 *'

permissions:
  contents: read

jobs:
  run-tests:
    name: Acceptance tests on AntonMauve-VTM
    uses: ./.github/workflows/MainlineTeamTests.yml
    with:
      SystemName: AntonMauve-VTM
      Branch: master
      JobName: AcceptanceTesting
      RunAllJobs: false
      UseInstalledPDC: false
    secrets: inherit