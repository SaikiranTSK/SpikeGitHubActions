name: Parallel Checkout Test

# Purpose: verify that different self-hosted runners (one per PC) check out the
# repo AT THE SAME TIME. Stops right after checkout - no build/test steps.
# Place this file at: .github/workflows/parallel-checkout-test.yml

on:
  workflow_dispatch:        # manual start: Actions tab -> Parallel Checkout Test -> Run workflow

concurrency:
  group: parallel-checkout-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkout-test:
    name: checkout on ${{ matrix.runner }}
    strategy:
      fail-fast: false      # one failure must not cancel the others
      max-parallel: 6       # all runners start together
      matrix:
        runner:
          - AntonMauve-VTM
          - Bhargava_BLR
          - Kratu_BLR
          - VTP01_BLR
          - Kanva_BLR
          - JacobVanCampen-VTM
    # Each runner has a unique label equal to its name, so each matrix job
    # lands on a different PC.
    runs-on: [self-hosted, Windows, X64, "${{ matrix.runner }}"]
    timeout-minutes: 15

    steps:
      - name: Record time before checkout
        id: pre
        shell: powershell    # Windows PowerShell 5.1 (pwsh is not installed on these PCs)
        run: |
          $t = [DateTime]::UtcNow.ToString("HH:mm:ss.fff")
          Add-Content -Path $env:GITHUB_OUTPUT -Value "start=$t" -Encoding ascii
          Write-Host "[$env:RUNNER_NAME] checkout starting at $t UTC"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Record time after checkout and report
        shell: powershell
        run: |
          $end = [DateTime]::UtcNow.ToString("HH:mm:ss.fff")
          $start = "${{ steps.pre.outputs.start }}"
          Write-Host "[$env:RUNNER_NAME] checkout finished at $end UTC"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding ascii -Value "### Runner: $env:RUNNER_NAME ($env:COMPUTERNAME)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding ascii -Value "| Checkout start (UTC) | Checkout end (UTC) |"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding ascii -Value "|---|---|"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding ascii -Value "| $start | $end |"
      # Intentionally stops here: parallel checkout verification only.
