name: MainlineTeamTestsdemoResult
run-name: ${{ inputs.SystemName }} - ${{ inputs.JobName }}

on:
  workflow_dispatch:
    inputs:
      SystemName:
        description: Physical test PC / runner label
        required: true
        type: string
      Branch:
        description: Legacy build branch selector; installation uses FastMsiPath instead.
        required: false
        type: string
        default: master
      UseInstalledPDC:
        description: Skip FAST installation and use the FAST already installed
        required: false
        type: boolean
        default: false
      FastMsiPath:
        description: Local runner path to an approved FAST MSI (required unless UseInstalledPDC is checked)
        required: false
        type: string
        default: ''
      FastMsiSha256:
        description: Expected SHA-256 of FastMsiPath (required unless UseInstalledPDC is checked)
        required: false
        type: string
        default: ''
      JobName:
        description: Test batch to run (ignored when RunAllJobs is checked)
        required: true
        type: string
      AllJobs:
        description: Comma-separated jobs used when RunAllJobs is true
        required: false
        type: string
        default: AcquisitionMain,PerformanceMain,GeoMain,FlexibleViewingMain,ViewingMain,ServiceWorkflowBatch01_Main,ServiceWorkflowBatch02_Main,ServiceWorkflowBatch03_Main,ReliabilityMain
      RunAllJobs:
        required: false
        type: boolean
        default: false
      TestCategories:
        description: NUnit categories for Viewing execution
        required: false
        type: string
        default: ''
      TEST_END_TIME:
        description: Europe/Amsterdam end time in YYYY-MM-DD HH:mm
        required: false
        type: string
        default: ''
      RestoreName:
        description: Backup folder name for RestoreMain
        required: false
        type: string
        default: ''
      RestoreFromLocation:
        description: Local runner folder containing the RestoreName backup; network paths are not supported.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  MainlineTeamTests:
    uses: ./.github/workflows/MainlineTeamTests.yml
    with:
      SystemName: ${{ inputs.SystemName }}
      Branch: ${{ inputs.Branch }}
      UseInstalledPDC: ${{ inputs.UseInstalledPDC }}
      FastMsiPath: ${{ inputs.FastMsiPath }}
      FastMsiSha256: ${{ inputs.FastMsiSha256 }}
      JobName: ${{ inputs.JobName }}
      AllJobs: ${{ inputs.AllJobs }}
      RunAllJobs: ${{ inputs.RunAllJobs }}
      TestCategories: ${{ inputs.TestCategories }}
      TEST_END_TIME: ${{ inputs.TEST_END_TIME }}
      RestoreName: ${{ inputs.RestoreName }}
      RestoreFromLocation: ${{ inputs.RestoreFromLocation }}
      SkipHooksIni: false
    secrets: inherit
