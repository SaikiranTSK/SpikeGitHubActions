name: Test Kratu Runner

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Create runner verification log
        shell: powershell
        run: |
          $logFolder = "C:\GitHubRunnerTest"
          $logFile = "$logFolder\runner-test.log"

          New-Item -ItemType Directory -Path $logFolder -Force | Out-Null

          @"
          ===== GITHUB ACTIONS RUNNER TEST =====
          Date          : $(Get-Date)
          Runner Name   : $env:RUNNER_NAME
          Computer Name : $env:COMPUTERNAME
          User          : $(whoami)
          Working Dir   : $(Get-Location)
          Result        : SUCCESS
          ======================================
          "@ | Out-File -FilePath $logFile -Append

          Write-Host "Log created:"
          Write-Host $logFile
