name: Copy Jenkins Tools

on:
  workflow_dispatch:
    inputs:
      system_name:
        description: Windows runner label for the target system
        required: true
        type: string

jobs:
  copy:
    runs-on: [self-hosted, Windows, "${{ inputs.system_name }}"]
    steps:
      - name: Copy Tools
        shell: powershell
        run: |
          robocopy '\\nlybstqvp4dt7nv.code1.emi.philips.com\JenkinsBatches\Tools' 'D:\Jenkins\Tools' /E /R:2 /W:5
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          robocopy '\\code1.emi.philips.com\storage\IGT-ATT\Scheduler\Tools' 'C:\Temp\FAST\AuxiliaryInstallationScript' /E /R:2 /W:5
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0
