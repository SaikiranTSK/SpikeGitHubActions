name: Copy Jenkins Tools

on:
  workflow_dispatch:
    inputs:
      system_name:
        description: Windows runner label for the target system
        required: true
        type: string

jobs:
  copy:
    runs-on: [self-hosted, Windows, "${{ inputs.system_name }}"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/Tools

      - name: Copy Tools
        shell: powershell
        run: |
          robocopy (Join-Path $env:GITHUB_WORKSPACE '.github/Tools') (Join-Path $env:GITHUB_WORKSPACE 'Tools') /E /R:2 /W:5
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0
