      Branch:
        description: Folder name beneath TestTooling, not a GitHub branch
        required: true
        type: choice
        options:
          - master
          - release-Azurion-R3.0
          - release-31.x
          - release-Azurion-R3.5
          - release-Azurion-R5.0
 
      UseInstalledPDC:
        required: true
        type: boolean
        default: false
 
      JobName:
        required: true
        type: choice
        options:
          - AcceptanceTesting
          - AcquisitionMain
          - GeoMain
          - PerformanceMain
          - ServiceWorkflowBatch01_Main
          - ServiceWorkflowBatch02_Main
          - ServiceWorkflowBatch03_Main
          - ServiceWorkflowBatch04_Main
          - ServiceWorkflowBatch05_Main
          - ServiceWorkflowBatch06_Main
          - ServiceWorkflowBatch07_Main
          - HospitalWorkFlowBatch01_Main
          - HospitalWorkFlowBatch02_Main
          - HospitalWorkFlowBatch03_Main
          - HospitalWorkFlowBatch04_Main
          - HospitalWorkflowMasterBatch01_Main
          - LicensesMain
          - ViewingMain
          - FlexibleViewingMain
          - AcquisitionMainlineDaily
          - PerformanceMainlineDaily
          - GeoMainlineDaily
          - HospitalWorkFlowMainlineDaily
          - ServiceWorkflowBatch01_MainlineDaily
          - ServiceWorkflowBatch02_MainlineDaily
          - LicensesMainlineDaily
          - ViewingMainlineDaily
          - FlexibleViewingMainlineDaily
          - ReliabilityMain
          - iProcedureMain
          - RestoreMain
          - HospitalWorkflowBatch01_MainlineDaily
          - ProcessingMain
          - iXrayControlMain
 
      AllJobs:
        description: Comma-separated jobs used when RunAllJobs is true
        required: false
        type: string
        default: 'AcquisitionMain,PerformanceMain,GeoMain,FlexibleViewingMain,ViewingMain,ServiceWorkflowBatch01_Main,ServiceWorkflowBatch02_Main,ServiceWorkflowBatch03_Main,Reliability'
 
      RunAllJobs:
        required: true
        type: boolean
        default: false
 
      TestCategories:
        required: false
        type: string
        default: ''
 
      TEST_END_TIME:
        description: Local test PC time in yyyy-MM-dd HH:mm format
        required: false
        type: string
        default: ''
 
      RestoreName:
        required: false
        type: string
        default: ''
 
      RestoreFromLocation:
        required: false
        type: string
        default: '\\code1.emi.philips.com\storage\SDI_Publish\TestSystems\Backups'
 
concurrency:
  group: lock_${{ inputs.SystemName }}
  cancel-in-progress: false
  queue: max
 
jobs:
  MainlineTeamTests:
    runs-on: [self-hosted, Windows, '${{ inputs.SystemName }}']
    timeout-minutes: 4320
 
    env:
      SystemName: ${{ inputs.SystemName }}
      Branch: ${{ inputs.Branch }}
      UseInstalledPDC: ${{ inputs.UseInstalledPDC }}
      JobName: ${{ inputs.JobName }}
      AllJobs: ${{ inputs.AllJobs }}
      RunAllJobs: ${{ inputs.RunAllJobs }}
      TestCategories: ${{ inputs.TestCategories }}
      TEST_END_TIME: ${{ inputs.TEST_END_TIME }}
      RestoreName: ${{ inputs.RestoreName }}
      RestoreFromLocation: ${{ inputs.RestoreFromLocation }}
 
    steps:
      - name: Execute MainlineTeamTests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
 
          $JenkinsBatchesPath = '\\nlybstqvp4dt7nv\JenkinsBatches'
          $DataPath = 'D:\Jenkins'
          $GenericApproach = Join-Path $DataPath 'GenericApproach'
          $HooksIni = 'C:\Program Files (x86)\FAST\Hooks.ini'
          $InstallationIni = 'C:\Program Files (x86)\FAST\Installation.ini'
          $restoreLocationOnSuitePC = 'D:\SystemBackups'
 
          function Invoke-BatchFile {
            param(
              [Parameter(Mandatory = $true)]
              [string] $Path,
 
              [string[]] $Arguments = @()
            )
 
            if (-not (Test-Path -LiteralPath $Path)) {
              throw "Batch file not found: $Path"
            }
 
            Write-Host "Executing: $Path"
              & $Path @Arguments | Out-Host
                          return [int]$LASTEXITCODE
          }
 
          function GetKillingCommands {
            & wmic.exe process where "name like 'nunit%.exe'" delete | Out-Host
            & wmic.exe process where "name like 'TAFTafFVAdapterCSExeCOMServer.exe'" delete | Out-Host
            & wmic.exe process where "name like 'iCapture%.exe'" delete | Out-Host
            & wmic.exe process where "name like 'testcentric%.exe'" delete | Out-Host
          }
 
          function Set-TestEndDateTime {
            param([AllowEmptyString()][string] $Value)
 
            if (-not (Test-Path -LiteralPath $HooksIni)) {
              Write-Host 'Hooks.ini file not found. Skipping TestEndDateTime update.'
              return
            }
 
            $content = Get-Content -LiteralPath $HooksIni
 
            if ($content -match '^TestEndDateTime\s*=') {
              $content -replace '^TestEndDateTime\s*=.*', "TestEndDateTime = $Value" |
                Set-Content -LiteralPath $HooksIni
            }
            else {
              Add-Content -LiteralPath $HooksIni -Value "TestEndDateTime = $Value"
            }
          }
 
          function Update-RestoreConfiguration {
            if (-not (Test-Path -LiteralPath $InstallationIni)) {
              Write-Warning 'Installation.ini file not found. Skipping RestoreMain.'
              return $false
            }
 
            try {
              $content = Get-Content -LiteralPath $InstallationIni
              $content = $content -replace `
                '^RestoreLocationOnSuitePC\s*=.*', `
                "RestoreLocationOnSuitePC = $restoreLocationOnSuitePC"
              $content = $content -replace `
                '^RestoreFromLocation\s*=.*', `
                "RestoreFromLocation = $($env:RestoreFromLocation)"
              $content = $content -replace `
                '^RestoreName\s*=.*', `
                "RestoreName = $($env:RestoreName)"
 
              Set-Content -LiteralPath $InstallationIni -Value $content
              return $true
            }
            catch {
              Write-Warning "Failed to update Installation.ini: $($_.Exception.Message)"
              return $false
            }
          }
 
          if ($env:RUNNER_NAME -ne $env:SystemName) {
            throw "Expected runner '$env:SystemName'; running on '$env:RUNNER_NAME'."
          }
 
          try {
            while (-not (Test-Path -LiteralPath $JenkinsBatchesPath)) {
              Write-Host 'Server busy... waiting'
              Start-Sleep -Seconds 10
            }
 
            & robocopy.exe `
              (Join-Path $JenkinsBatchesPath 'Tools') `
              (Join-Path $DataPath 'Tools') `
              /E /XO /FFT /MT:8 /R:3 /W:5 /NP /NFL /NDL | Out-Host
 
            if ($LASTEXITCODE -ge 8) {
              Write-Warning "Tools copy returned robocopy exit code $LASTEXITCODE."
            }
 
            & robocopy.exe `
              (Join-Path $JenkinsBatchesPath 'Batches\GenericApproach') `
              $GenericApproach `
              /E /XO /FFT /MT:8 /R:3 /W:5 /NP /NFL /NDL | Out-Host
 
            if ($LASTEXITCODE -ge 8) {
              Write-Warning "GenericApproach copy returned robocopy exit code $LASTEXITCODE."
            }
 
            GetKillingCommands
            Start-Sleep -Seconds 5
 
            if ($env:UseInstalledPDC -ne 'true') {
              $installExitCode = Invoke-BatchFile `
                -Path (Join-Path $GenericApproach 'install_fast_jenkins.cmd') `
                -Arguments @($env:Branch)
 
              Write-Host "Install FAST exit code: $installExitCode"
            }
            else {
              Write-Host 'Skipping FAST installation because UseInstalledPDC is checked.'
            }
 
            Set-TestEndDateTime -Value $env:TEST_END_TIME
 
            $endTime = $null
            if (-not [string]::IsNullOrWhiteSpace($env:TEST_END_TIME)) {
              $endTime = [datetime]::ParseExact(
                $env:TEST_END_TIME,
                'yyyy-MM-dd HH:mm',
                [Globalization.CultureInfo]::InvariantCulture
              )
            }
 
            $jobsToRun = if ($env:RunAllJobs -eq 'true') {
              @(
                $env:AllJobs.Split(',') |
                  ForEach-Object { $_.Trim() } |
                  Where-Object { $_ }
              )
            }
            else {
              @($env:JobName)
            }
 
            Write-Host "Jobs selected: $($jobsToRun -join ', ')"
 
            foreach ($job in $jobsToRun) {
              try {
                if ($null -ne $endTime -and (Get-Date) -gt $endTime) {
                  Write-Host "Skipping $job - End time reached"
                  break
                }
 
                $refreshExitCode = Invoke-BatchFile `
                  -Path (Join-Path $GenericApproach 'copy_nunit_specflow.cmd')
 
                Write-Host "Refresh Environment exit code: $refreshExitCode"
 
                if ($job -eq 'RestoreMain') {
                  if ([string]::IsNullOrWhiteSpace($env:RestoreName)) {
                    Write-Warning 'RestoreName is mandatory. Skipping RestoreMain.'
                    continue
                  }
 
                  if ([string]::IsNullOrWhiteSpace($env:RestoreFromLocation)) {
                    Write-Warning 'RestoreFromLocation is mandatory. Skipping RestoreMain.'
                    continue
                  }
 
                  if (-not (Update-RestoreConfiguration)) {
                    continue
                  }
                }
 
                $exitCode = Invoke-BatchFile `
                  -Path (Join-Path $GenericApproach 'execute_test_batch_jenkins.cmd') `
                  -Arguments @($job, $env:TestCategories)
 
                Write-Host "Test batch exit code for $job`: $exitCode"
 
                if ($exitCode -eq 9999) {
                  Write-Host 'Abort detected. Running ResetNidaq...'
 
                  $resetExitCode = Invoke-BatchFile `
                    -Path (Join-Path $GenericApproach 'execute_test_batch_jenkins.cmd') `
                    -Arguments @('ResetNidaq')
 
                  if ($resetExitCode -ne 0) {
                    throw "ResetNidaq failed with exit code $resetExitCode."
                  }
 
                  throw "Pipeline stopped due to abort in $job."
                }
 
                $copyExitCode = Invoke-BatchFile `
                  -Path (Join-Path $GenericApproach 'copy_results_to_nightbatch_jenkins.cmd') `
                  -Arguments @($job)
 
                if ($copyExitCode -ne 0) {
                  throw "NightBatch copy failed for $job with exit code $copyExitCode."
                }
 
                if ($exitCode -ne 0) {
                  Write-Warning "Test batch for $job returned $exitCode."
                }
              }
              finally {
                GetKillingCommands
              }
            }
          }
          finally {
            Set-TestEndDateTime -Value ''
          }
 
          exit 0
